name: Pull Request Tests & Validation
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - release
      - develop

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Lint
        run: npm run lint
        working-directory: ./functions

      - name: Check code formatting
        run: npm run format:check
        working-directory: ./functions

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: ./functions
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Run unit tests
        run: npm test
        working-directory: ./functions

      - name: Upload test coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: ./functions/coverage/
          retention-days: 14
        if: success()

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Set up test environment variables
        run: |
          # Create .env file from GitHub Environment secrets
          cat << EOF > .env
          # Auto-generated from GitHub Environment for testing
          $(echo "${{ vars.TEST_ENV_VARS }}" | sed 's/,/\n/g')
          
          # Add sensitive test secrets individually
          TEST_API_KEY="${{ secrets.TEST_API_KEY }}"
          TEST_FIREBASE_TOKEN="${{ secrets.TEST_FIREBASE_TOKEN }}"
          TEST_STRIPE_KEY="${{ secrets.TEST_STRIPE_KEY }}"
          TEST_AUTH_SECRET="${{ secrets.TEST_AUTH_SECRET }}"
          EOF
        working-directory: ./functions

      - name: Install Firebase Emulators
        run: npm install -g firebase-tools

      - name: Run integration tests
        run: npm run test:integration
        working-directory: ./functions

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Build production bundle
        run: npm run build
        working-directory: ./functions

      - name: Check bundle size
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: ./functions/

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run npm audit
        run: npm audit --production
        working-directory: ./functions
        continue-on-error: true

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript