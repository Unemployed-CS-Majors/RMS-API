name: Pull Request Tests & Validation
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - release
      - develop

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Run unit tests
        run: npm test
        working-directory: ./functions

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./functions/coverage/
          retention-days: 14
        if: success()