openapi: 3.0.0
info:
  title: RMS API
  version: 1.0.0
  description: Restaurant Management System API
servers:
  - url: https://api-d4o6tbc5fq-uc.a.run.app/
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/login:
    post:
      summary: Login a user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User logged in successfully
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/refreshToken:
    post:
      summary: Refresh user token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/createEmployee:
    post:
      summary: Create a new employee
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '201':
          description: Employee created successfully
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/createOwner:
    post:
      summary: Create a new owner
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '201':
          description: Owner created successfully
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/deleteEmployee/{uid}:
    delete:
      summary: Delete an employee
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: The user ID of the employee to delete
      responses:
        '204':
          description: Employee deleted successfully
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/google:
    post:
      summary: Sign in with Google
      tags:
        - Auth
      description: >-
        Accepts an ID token from the client after Google sign-in via Firebase
        Auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Google sign-in successful
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/forgotPassword:
    post:
      summary: Send a password reset email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Password reset email sent
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /auth/deleteAccount:
    delete:
      summary: Delete the authenticated user's account
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully
        '500':
          description: Internal server error
  /doors:
    get:
      summary: Retrieve a list of all doors
      security:
        - bearerAuth: []
      tags:
        - Doors
      responses:
        '200':
          description: A list of doors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Door'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create a new door
      security:
        - bearerAuth: []
      tags:
        - Doors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Door'
      responses:
        '201':
          description: Door created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the newly created door
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /doors/{doorId}:
    get:
      summary: Retrieve a door by ID
      security:
        - bearerAuth: []
      tags:
        - Doors
      parameters:
        - in: path
          name: doorId
          required: true
          schema:
            type: string
          description: The ID of the door to retrieve
      responses:
        '200':
          description: The door details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Door'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Door not found
    put:
      summary: Update a door by ID
      security:
        - bearerAuth: []
      tags:
        - Doors
      parameters:
        - in: path
          name: doorId
          required: true
          schema:
            type: string
          description: The ID of the door to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Door'
      responses:
        '200':
          description: Door updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Door'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Door not found
    delete:
      summary: Delete a door by ID
      security:
        - bearerAuth: []
      tags:
        - Doors
      parameters:
        - in: path
          name: doorId
          required: true
          schema:
            type: string
          description: The ID of the door to delete
      responses:
        '200':
          description: Door deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Door not found
  /floorPlan:
    get:
      summary: Retrieve the floor plan
      tags:
        - FloorPlan
      responses:
        '200':
          description: The floor plan details
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/Table'
                  doors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Door'
                  walls:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
                  windows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Window'
        '500':
          description: Internal server error
  /:
    post:
      summary: Create a new menu item
      tags:
        - MenuItem
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                type:
                  type: string
                calories:
                  type: number
                avgWaitTime:
                  type: number
                allergens:
                  type: array
                  items:
                    type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Menu item created successfully
        '400':
          description: Validation failed
        '500':
          description: Failed to create menu item
    get:
      summary: Get all menu items
      tags:
        - MenuItem
      responses:
        '200':
          description: Menu items retrieved successfully
        '500':
          description: Failed to retrieve menu items
  /enums:
    get:
      summary: Get enum values
      tags:
        - MenuItem
      responses:
        '200':
          description: Enum values retrieved successfully
        '500':
          description: Failed to retrieve enum values
  /{id}:
    get:
      summary: Get a menu item by ID
      tags:
        - MenuItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item retrieved successfully
        '404':
          description: Menu item not found
        '500':
          description: Failed to retrieve menu item
    put:
      summary: Update a menu item
      tags:
        - MenuItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                type:
                  type: string
                calories:
                  type: number
                avgWaitTime:
                  type: number
                allergens:
                  type: array
                  items:
                    type: string
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Menu item updated successfully
        '400':
          description: Validation failed
        '404':
          description: Menu item not found
        '500':
          description: Failed to update menu item
    delete:
      summary: Delete a menu item
      tags:
        - MenuItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item deleted successfully
        '404':
          description: Menu item not found
        '500':
          description: Failed to delete menu item
  /opening-hours/{id}:
    get:
      summary: Retrieve opening hours by ID
      tags:
        - Opening Hours
      description: Retrieve the opening hours for a specific ID.
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the opening hours to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  openingHours:
                    type: string
        '404':
          description: Opening hours not found
    put:
      summary: Update opening hours
      tags:
        - Opening Hours
      description: Update existing opening hours.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the opening hours to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
      responses:
        '200':
          description: Opening hours updated successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Opening hours not found
    delete:
      summary: Delete opening hours
      tags:
        - Opening Hours
      description: Delete existing opening hours.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the opening hours to delete.
          schema:
            type: string
      responses:
        '200':
          description: Opening hours deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Opening hours not found
  /opening-hours:
    get:
      summary: Retrieve all opening hours
      tags:
        - Opening Hours
      description: Retrieve all opening hours.
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    openingHours:
                      type: string
    post:
      summary: Create new opening hours
      tags:
        - Opening Hours
      description: Create new opening hours.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
      responses:
        '201':
          description: Opening hours created successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /orders:
    post:
      summary: Create a new order
      tags:
        - Order
      description: >-
        Creates a new order with specified items, delivery method, and payment
        method.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - deliveryMethod
                - paymentMethod
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Menu item ID
                      quantity:
                        type: number
                        description: Quantity of the item
                      price:
                        type: number
                        description: Price of the item
                      name:
                        type: string
                        description: Name of the item
                deliveryMethod:
                  type: string
                  enum:
                    - home_delivery
                    - pickup
                  description: Method of delivery
                paymentMethod:
                  type: string
                  enum:
                    - online
                    - cash_on_delivery
                    - in_store
                  description: Method of payment
                deliveryAddress:
                  type: object
                  description: Required for home_delivery
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zipCode:
                      type: string
                    country:
                      type: string
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  items:
                    type: array
                  subtotal:
                    type: number
                  tax:
                    type: number
                  deliveryFee:
                    type: number
                  total:
                    type: number
                  deliveryMethod:
                    type: string
                  paymentMethod:
                    type: string
                  status:
                    type: string
                  redirectUrl:
                    type: string
                    description: URL to redirect for online payment (if applicable)
        '400':
          description: Validation error
        '401':
          description: Unauthorized
    get:
      summary: Get user's orders
      tags:
        - Order
      description: Retrieves all orders for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Maximum number of orders to return
      responses:
        '200':
          description: A list of user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    userId:
                      type: string
                    items:
                      type: array
                    subtotal:
                      type: number
                    tax:
                      type: number
                    deliveryFee:
                      type: number
                    total:
                      type: number
                    deliveryMethod:
                      type: string
                    paymentMethod:
                      type: string
                    status:
                      type: string
        '401':
          description: Unauthorized
  /orders/{orderId}:
    get:
      summary: Get order by ID
      tags:
        - Order
      description: Retrieves a specific order by its ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          description: The ID of the order to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  items:
                    type: array
                  subtotal:
                    type: number
                  tax:
                    type: number
                  deliveryFee:
                    type: number
                  total:
                    type: number
                  deliveryMethod:
                    type: string
                  paymentMethod:
                    type: string
                  status:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
  /orders/{orderId}/cancel:
    post:
      summary: Cancel an order
      tags:
        - Order
      description: Cancels an existing order if it's in a cancellable state.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          description: The ID of the order to cancel.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelReason:
                  type: string
                  description: Reason for cancellation
      responses:
        '200':
          description: Order canceled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - canceled
                  cancelReason:
                    type: string
        '400':
          description: Order cannot be canceled in its current state
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
  /orders/{orderId}/status:
    patch:
      summary: Update order status
      tags:
        - Order
      description: Updates the status of an order (restaurant employees only).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          description: The ID of the order to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending_payment
                    - paid
                    - in_progress
                    - ready_for_pickup
                    - out_for_delivery
                    - completed
                    - canceled
      responses:
        '200':
          description: Order status updated successfully
        '400':
          description: Invalid status or status transition
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a restaurant employee
        '404':
          description: Order not found
  /orders/employee/active:
    get:
      summary: Get active orders
      tags:
        - Order
      description: Retrieves all active orders (restaurant employees only).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Maximum number of orders to return
      responses:
        '200':
          description: List of active orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    userId:
                      type: string
                    items:
                      type: array
                    status:
                      type: string
                    createdAt:
                      type: number
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a restaurant employee
  /orders/employee/status/{status}:
    get:
      summary: Get orders by status
      tags:
        - Order
      description: Retrieves all orders with a specific status (restaurant employees only).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: status
          required: true
          description: The status to filter by.
          schema:
            type: string
            enum:
              - pending_payment
              - paid
              - in_progress
              - ready_for_pickup
              - out_for_delivery
              - completed
              - canceled
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Maximum number of orders to return
      responses:
        '200':
          description: List of orders with the specified status
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    userId:
                      type: string
                    items:
                      type: array
                    status:
                      type: string
                    createdAt:
                      type: number
        '400':
          description: Invalid status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a restaurant employee
  /payments/webhook:
    post:
      summary: Stripe webhook endpoint
      description: Endpoint for handling Stripe webhook events.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '400':
          description: Invalid webhook signature or payload
  /payments/success:
    get:
      summary: Payment success redirect
      tags:
        - Payments
      description: Endpoint for handling successful payment redirects from Stripe.
      parameters:
        - in: query
          name: session_id
          required: true
          description: The Stripe Checkout Session ID.
          schema:
            type: string
      responses:
        '302':
          description: Redirects to success page
        '400':
          description: Missing session ID
        '500':
          description: Error processing successful payment
  /payments/cancel:
    get:
      summary: Payment cancel redirect
      tags:
        - Payments
      description: Endpoint for handling canceled payment redirects from Stripe.
      parameters:
        - in: query
          name: orderId
          description: The order ID (if available).
          schema:
            type: string
      responses:
        '302':
          description: Redirects to cancellation page
        '500':
          description: Error processing payment cancellation
  /reservation/create:
    post:
      summary: Create a new reservation
      description: Create a new reservation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tableId:
                  type: string
                startTime:
                  type: string
                  description: ISO 8601 date-time string
                endTime:
                  type: string
                  description: ISO 8601 date-time string
                people:
                  type: integer
      responses:
        '201':
          description: Reservation created successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /reservation/cancel/{reservationId}:
    post:
      summary: Cancel a reservation
      description: Cancel an existing reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: The ID of the reservation to cancel.
          schema:
            type: string
      responses:
        '200':
          description: Reservation cancelled successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Reservation not found
  /reservation/confirm/{reservationId}:
    post:
      summary: Confirm a reservation
      description: Confirm an existing reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: The ID of the reservation to confirm.
          schema:
            type: string
      responses:
        '200':
          description: Reservation confirmed successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Reservation not found
  /reservation/complete/{reservationId}:
    post:
      summary: Complete a reservation
      description: Complete an existing reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: The ID of the reservation to complete.
          schema:
            type: string
      responses:
        '200':
          description: Reservation completed successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Reservation not found
  /reservation/reschedule/{reservationId}:
    post:
      summary: Reschedule a reservation
      description: Reschedule an existing reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: The ID of the reservation to reschedule.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                time:
